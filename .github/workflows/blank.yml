name: Pull Windows Docker Image and Save as Artifact

on:
  push:
    branches:
      - stable

jobs:
  pull-docker-image:
    runs-on: ubuntu-latest

    steps:
      # Step 3: Pull the Windows Docker image
      - name: Pull Rocky Linux Docker Image
        run: |
          docker pull rockylinux:8.10
          
      # Step 4: Save the Docker image to a .tar file
      - name: Save Docker Image as TAR
        run: |
          docker save -o rocky.tar rockylinux:8.10

      # Step 5: Upload the .tar file as an artifact
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocky
          path: rocky.tar
